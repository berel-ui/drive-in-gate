<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drive-In Gate</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0f1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gate">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
/* One dark look on purpose: the gate runs at dusk, and bright screens wash out in headlights. */
:root{
  --bg:#0f1218; --panel:#181d26; --line:#2a313e; --ink:#eef1f6; --muted:#9aa3b5;
  --ok:#1f9d57; --bad:#d23c36; --warn:#e2a227; --accent:#3fb6ad;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f)}
.wrap{max-width:560px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-left)) 40px max(14px,env(safe-area-inset-right));display:grid;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;padding:6px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:#123522;color:#7fe3a8;border-color:transparent}
.pill.bad{background:#3b1513;color:#ff9b95;border-color:transparent}
.pill.warn{background:#3a2a0c;color:#ffd27a;border-color:transparent}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.note{font-size:13px;color:var(--muted)}
button,.btn{font:600 16px var(--f);border-radius:10px;border:1px solid var(--line);background:#232a36;color:var(--ink);padding:12px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#06201e}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:16px var(--f);color:var(--ink);background:#10141b;border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.7);border-radius:14px;pointer-events:none}
.cam .camtext{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:15px}
.verdict{position:fixed;inset:0;z-index:20;display:grid;align-content:center;justify-items:center;gap:10px;padding:24px;text-align:center}
.verdict .big{font-size:clamp(40px,13vw,72px);font-weight:900;letter-spacing:.01em;line-height:1}
.verdict .who{font-size:24px;font-weight:700}
.verdict .sub{font-size:17px;max-width:30ch}
.verdict .acts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.v-ok{background:var(--ok);color:#fff}
.v-bad{background:var(--bad);color:#fff}
.v-wait{background:#1d2533;color:#fff}
.v-vip{background:#1565ff;color:#fff}
.v-vip .big{font-size:clamp(90px,34vw,180px);letter-spacing:.04em}
.v-vip .tag{font-size:22px;font-weight:800;background:rgba(255,255,255,.18);padding:8px 16px;border-radius:99px}
.verdict button{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.5);color:inherit;font-size:18px;padding:14px 18px}
.list{display:grid;gap:6px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border-radius:10px;background:#10141b}
.item .t{min-width:0}
.item .n{font-weight:700;overflow-wrap:anywhere}
.item .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.log div{font-size:13px;display:flex;gap:8px;flex-wrap:wrap;padding:3px 0}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:58px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Gate</h1>
    <span class="pill" id="status">Loading…</span>
  </header>

  <div class="cam" id="cam">
    <video id="video" playsinline muted></video>
    <div class="frame" id="frame" hidden></div>
    <div class="camtext" id="camtext"><span>Tap <b>Start camera</b> and point it at the QR code.</span></div>
  </div>
  <div class="row">
    <button type="button" class="primary" id="camstart" style="flex:1">Start camera</button>
    <button type="button" id="torch" style="flex:1" hidden>Flashlight on</button>
    <button type="button" id="photobtn" style="flex:1">Take a photo instead</button>
    <input type="file" id="photo" accept="image/*" capture="environment" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
  </div>

  <div class="panel" style="display:grid;gap:8px">
    <label for="q" style="font-weight:700">No QR code? Search by name or car</label>
    <input id="q" type="search" placeholder="e.g. Cohen or Honda" autocomplete="off">
    <div class="list" id="results"></div>
  </div>

  <div class="panel" style="display:grid;gap:8px">
    <div class="row" style="justify-content:space-between">
      <span class="note" id="listinfo">Loading the gate list…</span>
      <button type="button" id="refresh" style="padding:8px 12px;font-size:14px">Get new sign-ups</button>
    </div>
    <label class="note" for="device">This phone’s name (shows who let each car in)</label>
    <input id="device" placeholder="e.g. Gate 1 – Mendy" maxlength="40">
  </div>

  <div id="conflicts" hidden></div>

  <div class="panel">
    <div style="font-weight:700;margin-bottom:6px">Recent on this phone</div>
    <div class="log" id="log"><span class="note">No scans yet.</span></div>
  </div>
</div>

<div class="verdict" id="verdict" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
var QR_TAG = 'CPWDI26';
var P = 'gate26-';
// The gate key comes in the link (#key=…) the first time, then is remembered on this phone,
// so the home-screen icon opens straight to the gate.
var CFG = {
  api: 'https://script.google.com/macros/s/AKfycbzUB_WUniaWlgzrq-Nb687_GGshlUY-mHff35IsOX1NrJuXdPR7lqr1gepKB-IfpIjxVQ/exec',
  eventName: 'Chanukah Drive-In 2026',
  key: ''
};
(function(){
  var m = (location.hash + '&' + location.search).match(/[#?&]key=([A-Za-z0-9]+)/);
  try {
    if (m) { CFG.key = m[1]; localStorage.setItem(P + 'key', JSON.stringify(m[1])); }
    else CFG.key = JSON.parse(localStorage.getItem(P + 'key') || '""');
  } catch(e){ if (m) CFG.key = m[1]; }
  // The key stays in the address so "Add to Home Screen" keeps it (iPhone home-screen apps don't share Safari's storage).
  // The app settings file has no fixed start address, so "Add to Home Screen" saves this exact address, key included.
  if (CFG.key && !m && history.replaceState) try { history.replaceState(null, '', location.pathname + '#key=' + CFG.key); } catch(e){}
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var LS = {
  get: function(k, d){ try { var v = localStorage.getItem(P + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem(P + k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
var fmtTime = function(ms){ return ms ? new Date(ms).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : ''; };
var norm = function(s){ return String(s == null ? '' : s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); };

/* ---------- state kept on this phone ---------- */
var list = LS.get('list', null);           // {signups, checkins, at}
var queue = LS.get('queue', []);           // check-ins made here, not yet confirmed by the sheet
var localUsed = LS.get('used', {});        // id -> phone time, for cars let in on this phone
var conflicts = LS.get('conflicts', []);   // cars let in twice while phones were offline
var lastOk = 0, flushing = false, refreshing = false;
var device = LS.get('device', '');
$('#device').value = device;
$('#device').addEventListener('change', function(e){ device = e.target.value.trim(); LS.set('device', device); });
CFG.eventName = LS.get('event', CFG.eventName);
$('#title').textContent = CFG.eventName + ' · Gate';
if (!CFG.key) {
  document.querySelector('.wrap').innerHTML = '<div class="panel" style="margin-top:24px;display:grid;gap:10px"><h1>Gate code needed</h1>' +
    '<p style="margin:0">Paste the gate link the office sent you, or type the gate code (the part after <b>#key=</b>). This phone will remember it.</p>' +
    '<input id="keyin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gate link or code">' +
    '<button type="button" class="primary" id="keysave">Open the gate</button><span class="note" id="keymsg"></span></div>';
  $('#keysave').addEventListener('click', function(){
    var raw = $('#keyin').value.trim(), m2 = raw.match(/key=([A-Za-z0-9]+)/), k = m2 ? m2[1] : (/^[A-Za-z0-9]{8,}$/.test(raw) ? raw : '');
    if (!k) { $('#keymsg').textContent = 'That doesn’t look like a gate link or code.'; return; }
    try { localStorage.setItem(P + 'key', JSON.stringify(k)); } catch(e){}
    location.replace(location.pathname + '#key=' + k); location.reload();
  });
  return;
}
function save(){ LS.set('queue', queue); LS.set('used', localUsed); LS.set('conflicts', conflicts); }
function deviceName(){ return device || 'Gate phone'; }

/* ---------- talking to the sheet ---------- */
function withTimeout(p, ms){ return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]); }
function call(action, extra){
  var body = Object.assign({action: action, key: CFG.key}, extra || {});
  // text/plain keeps this a "simple" request, so Google's script accepts it from another site.
  return fetch(CFG.api, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body)}).then(function(r){ return r.json(); });
}
function online(){ return navigator.onLine !== false; }

// withImport: also read the newest Chabad.org notices from Gmail first ("Get new sign-ups").
function refresh(withImport){
  if (refreshing || !online()) { render(); return Promise.resolve(); }
  refreshing = true;
  return withTimeout(call(withImport ? 'import' : 'list'), withImport ? 60000 : 12000).then(function(r){
    if (!r || !r.ok) { $('#listinfo').textContent = r && r.error === 'bad_key' ? 'This gate link is out of date. Ask the office for the new one.' : 'The gate list didn’t load.'; return; }
    list = {signups: r.signups, checkins: r.checkins, at: Date.now()};
    if (r.event && r.event !== CFG.eventName) { CFG.eventName = r.event; LS.set('event', r.event); $('#title').textContent = r.event + ' · Gate'; }
    // Cars this phone let in stay marked until the sheet has them, so nothing flips back to "not in".
    Object.keys(localUsed).forEach(function(id){
      var queued = queue.some(function(q){ return q.id === id; });
      if (list.checkins[id] && !queued) delete localUsed[id];
    });
    LS.set('list', list); save(); lastOk = Date.now();
  }).catch(function(){}).then(function(){ refreshing = false; render(); });
}

/* Only "this car was let in" ever goes up, and the sheet only adds a row if that car isn't in yet. */
function flush(){
  if (flushing || !queue.length || !online()) return Promise.resolve();
  flushing = true;
  var batch = queue.slice(0, 50);
  return withTimeout(call('checkin', {items: batch}), 15000).then(function(r){
    if (!r || !r.ok) return;
    lastOk = Date.now();
    r.results.forEach(function(x){
      var q = batch.filter(function(b){ return b.id === x.id; })[0];
      if (x.status === 'already' && q) {
        var s = findSignup(x.id);
        conflicts.unshift({id: x.id, name: s ? (s.first + ' ' + s.last) : x.id, first: x.at, firstBy: x.device, again: q.at});
      }
      if (list && (x.status === 'ok' || x.status === 'already')) list.checkins[x.id] = list.checkins[x.id] || {at: x.at, device: x.device};
      queue = queue.filter(function(b){ return !(b.id === x.id && b.at === (q && q.at)); });
    });
    save(); if (list) LS.set('list', list);
  }).catch(function(){}).then(function(){ flushing = false; render(); });
}
setInterval(function(){ if (!document.hidden) { flush().then(refresh); } }, 15000);
window.addEventListener('online', function(){ flush().then(refresh); });
window.addEventListener('offline', render);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) flush().then(refresh); });
$('#refresh').addEventListener('click', function(){
  var b = $('#refresh'); b.disabled = true; b.textContent = 'Checking…';
  flush().then(function(){ return refresh(true); }).then(function(){ b.disabled = false; b.textContent = 'Get new sign-ups'; });
});

/* ---------- matching ---------- */
function signups(){ return (list && list.signups) || []; }
function findSignup(id){ return signups().filter(function(s){ return s.id === id; })[0]; }
function usedInfo(id){
  if (list && list.checkins[id]) return list.checkins[id];
  if (localUsed[id]) return {at: localUsed[id], device: deviceName()};
  return null;
}
function carLine(s){ return [[s.year, s.color, s.car].filter(Boolean).join(' '), s.people ? s.people + (String(s.people) === '1' ? ' person' : ' people') : '', s.ticket].filter(Boolean).join(' · '); }
function parseScan(raw){
  var s = String(raw || '').trim();
  if (s.toUpperCase().indexOf(QR_TAG + '|') !== 0) return null;
  var p = s.split('|').map(function(x){ x = x.replace(/\+/g, ' '); try { x = decodeURIComponent(x); } catch(e){} return x.trim(); });
  return {first: p[1] || '', last: p[2] || '', car: p[3] || '', color: p[4] || '', year: p[5] || '', people: p[6] || ''};
}
var KEYS = ['car', 'color', 'year', 'people'], LABEL = {car: 'Car', color: 'Color', year: 'Year', people: 'People'};
// A blank or cut-short part of the QR code doesn't count as a difference: an "&" or "#"
// typed into the form can cut the rest of the code off. Only real disagreements do.
function same(qr, sheet){ var a = norm(qr), b = norm(sheet); return !a || a === b || b.indexOf(a) === 0; }
function match(d){
  var diffs = function(s){ return KEYS.filter(function(k){ return !same(d[k], s[k]); }); };
  var byName = signups().filter(function(s){ return norm(s.first) === norm(d.first) && same(d.last, s.last) && norm(d.last); });
  var full = byName.filter(function(s){ return !diffs(s).length; });
  if (full.length) return {status: 'match', s: full.filter(function(s){ return !usedInfo(s.id) && !s.cancelled; })[0] || full[0]};
  if (byName.length) { var best = byName.slice().sort(function(a, b){ return diffs(a).length - diffs(b).length; })[0]; return {status: 'mismatch', s: best, diffs: diffs(best)}; }
  var byCar = norm(d.car) ? signups().filter(function(s){ return !diffs(s).length; })[0] : null;
  if (byCar) return {status: 'mismatch', s: byCar, diffs: ['name']};
  return {status: 'none'};
}

/* ---------- verdict screen ---------- */
var vTimer = null, paused = false;
function beep(good){
  try {
    var a = window.__ac || (window.__ac = new (window.AudioContext || window.webkitAudioContext)());
    var o = a.createOscillator(), g = a.createGain();
    o.type = good ? 'sine' : 'square'; o.frequency.value = good ? 1046 : 220;
    g.gain.setValueAtTime(0.2, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + (good ? 0.2 : 0.5));
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + (good ? 0.22 : 0.55));
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate(good ? 80 : [120, 80, 120]); } catch(e){}
}
// Whole screen turns one color: green = good to go, blue = VIP (send to VIP parking), red = stop.
function verdict(kind, big, who, sub, actions, tag){
  var v = $('#verdict');
  v.className = 'verdict ' + {ok: 'v-ok', vip: 'v-vip', bad: 'v-bad'}[kind];
  var acts = actions || [{label: 'Next car', run: hideVerdict}];
  v.innerHTML = '<div class="big">' + esc(big) + '</div>' + (tag ? '<div class="tag">' + esc(tag) + '</div>' : '') + (who ? '<div class="who">' + esc(who) + '</div>' : '') + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') +
    '<div class="acts">' + acts.map(function(a, i){ return '<button type="button" data-i="' + i + '">' + esc(a.label) + '</button>'; }).join('') + '</div>';
  v.hidden = false; paused = true; beep(kind !== 'bad');
  v.onclick = function(e){ var b = e.target.closest('button'); if (b) acts[+b.dataset.i].run(); else if (!actions) hideVerdict(); };
  clearTimeout(vTimer);
  if (!actions) vTimer = setTimeout(hideVerdict, kind === 'ok' ? 2500 : kind === 'vip' ? 4000 : 5000);
}
function hideVerdict(){ clearTimeout(vTimer); $('#verdict').hidden = true; paused = false; lastValue = ''; }
var log = [];
function addLog(kind, who, text){
  log.unshift({t: Date.now(), kind: kind, who: who, text: text}); log.length = Math.min(log.length, 15);
  $('#log').innerHTML = log.map(function(l){ return '<div><time>' + fmtTime(l.t) + '</time><span class="pill ' + l.kind + '">' + (l.kind === 'ok' ? 'In' : l.kind === 'warn' ? 'Already in' : 'Stopped') + '</span><span>' + esc(l.who) + '</span><span class="note">' + esc(l.text) + '</span></div>'; }).join('');
}

/* ---------- letting a car in ---------- */
function admit(s, note){
  var u = usedInfo(s.id), who = (s.first + ' ' + s.last).trim();
  if (s.cancelled) { verdict('bad', 'Cancelled', who, carLine(s) + ' · this registration was cancelled. Send them to the office tent.'); addLog('bad', who, 'cancelled'); return; }
  if (u) { verdict('bad', 'Already in', who, carLine(s) + ' · let in at ' + fmtTime(u.at) + ' by ' + (u.device || 'another phone')); addLog('warn', who, 'first at ' + fmtTime(u.at)); return; }
  var at = Date.now();
  localUsed[s.id] = at; queue.push({id: s.id, at: at, device: deviceName(), note: note || ''}); save();
  // Several cars under one name is normal; just mention it.
  var sameName = signups().filter(function(x){ return x.id !== s.id && !x.cancelled && norm(x.first) === norm(s.first) && norm(x.last) === norm(s.last); }).length;
  var details = [carLine(s), sameName ? (sameName + 1) + ' cars registered under this name' : '', s.comments ? 'Note: ' + s.comments : '', online() ? '' : 'No signal · saved on this phone'].filter(Boolean).join(' · ');
  if (s.ticket === 'VIP Sponsor') verdict('vip', 'VIP', who, details, null, 'Send to VIP parking');
  else verdict('ok', 'Admit', who, details);
  addLog('ok', who, online() ? carLine(s) : 'saved, will sync');
  // Send right away; if the sheet says another phone already let them in, say so.
  flush().then(function(){
    var c = conflicts[0];
    if (c && c.id === s.id && c.again === at && !$('#verdict').hidden) verdict('bad', 'Already in', who, 'Another phone let this car in at ' + fmtTime(c.first) + (c.firstBy ? ' (' + c.firstBy + ')' : ''));
  });
  render();
}
function showChecking(){
  var v = $('#verdict'); clearTimeout(vTimer);
  v.className = 'verdict v-wait';
  v.innerHTML = '<div class="big">Checking…</div><div class="sub">Looking for new sign-ups</div>';
  v.hidden = false; paused = true; v.onclick = null;
}
function handleScan(raw, retried){
  var d = parseScan(raw);
  if (!d) { verdict('bad', 'Not a gate pass', '', 'This QR code isn’t from the Drive-In confirmation email.'); addLog('bad', String(raw).slice(0, 20), 'not a gate pass'); return; }
  var who = (d.first + ' ' + d.last).trim();
  var m = signups().length ? match(d) : {status: 'none'};
  // Not a clean match on this phone's copy of the list: with signal, get the newest sign-ups and look again
  // before showing red, since the car may have registered after this phone last updated.
  if (m.status !== 'match' && online() && !retried) {
    showChecking();
    refresh(true).then(function(){ hideVerdict(); handleScan(raw, true); });
    return;
  }
  if (!signups().length) { verdict('bad', 'No gate list', who, 'This phone hasn’t loaded the list yet. Get signal and tap Get new sign-ups.'); return; }
  if (m.status === 'none') {
    verdict('bad', 'Not on the list', who, [d.year, d.color, d.car].filter(Boolean).join(' ') + ' · no paid sign-up has these details.' + (online() ? '' : ' (No signal: list from ' + fmtTime(list.at) + ')'));
    addLog('bad', who, 'not on list'); return;
  }
  if (m.status === 'mismatch') {
    var s = m.s, text = m.diffs.map(function(k){ return k === 'name' ? 'Name on QR: ' + who : LABEL[k] + ' on QR: ' + (d[k] || '—') + ', signed up as: ' + (s[k] || '—'); }).join(' · ');
    verdict('bad', 'Check details', s.first + ' ' + s.last + ' · ' + carLine(s), text, [
      {label: 'Admit anyway', run: function(){ hideVerdict(); admit(s, 'admitted with mismatch'); }},
      {label: 'Don’t admit', run: hideVerdict}
    ]);
    addLog('bad', who, 'details differ'); return;
  }
  admit(m.s);
}

/* ---------- search ---------- */
$('#q').addEventListener('input', renderResults);
function renderResults(){
  var q = norm($('#q').value), el = $('#results');
  if (q.length < 2) { el.innerHTML = ''; return; }
  var hits = signups().filter(function(s){ return norm([s.first, s.last, s.car, s.color].join(' ')).indexOf(q) >= 0; }).slice(0, 12);
  el.innerHTML = hits.length ? hits.map(function(s){
    var u = usedInfo(s.id);
    return '<div class="item"><div class="t"><div class="n">' + esc(s.first + ' ' + s.last) + '</div><div class="d">' + esc(carLine(s)) + '</div></div>' +
      (s.cancelled ? '<span class="pill bad">Cancelled</span>' : u ? '<span class="pill warn">In ' + fmtTime(u.at) + '</span>' : '<button type="button" class="primary" data-id="' + esc(s.id) + '">Check in</button>') + '</div>';
  }).join('') : '<span class="note">No sign-up matches that.</span>';
}
$('#results').addEventListener('click', function(e){
  var b = e.target.closest('button[data-id]'); if (!b) return;
  var s = findSignup(b.dataset.id); if (s) { admit(s, 'checked in by search'); $('#q').value = ''; renderResults(); }
});

/* ---------- camera ---------- */
var video = $('#video'), stream = null, detector = null, lastValue = '', lastAt = 0, busyFrame = false;
var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', {willReadFrequently: true});
try { if ('BarcodeDetector' in window) detector = new BarcodeDetector({formats: ['qr_code']}); } catch(e){ detector = null; }
function onValue(v){
  if (!v || paused) return;
  var now = Date.now();
  if (v === lastValue && now - lastAt < 6000) return;
  lastValue = v; lastAt = now;
  handleScan(v);
}
function tick(){
  if (!stream) return;
  if (!paused && !busyFrame && video.readyState >= 2) {
    busyFrame = true;
    if (detector) {
      detector.detect(video).then(function(c){ if (c && c[0]) onValue(c[0].rawValue); }).catch(function(){ detector = null; }).then(function(){ busyFrame = false; });
    } else {
      var w = 640, h = Math.round(video.videoHeight * w / video.videoWidth) || 480;
      canvas.width = w; canvas.height = h; ctx.drawImage(video, 0, 0, w, h);
      var r = window.jsQR ? jsQR(ctx.getImageData(0, 0, w, h).data, w, h, {inversionAttempts: 'dontInvert'}) : null;
      if (r) onValue(r.data);
      busyFrame = false;
    }
  }
  setTimeout(tick, 150);
}
$('#camstart').addEventListener('click', function(){
  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; torchOn = false; $('#torch').hidden = true; $('#camstart').textContent = 'Start camera'; $('#frame').hidden = true; $('#camtext').hidden = false; return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('#camtext').textContent = 'Live camera isn’t available here. Use “Take a photo instead”.'; return; }
  navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment', width: {ideal: 1280}}, audio: false}).then(function(s){
    stream = s; video.srcObject = s; return video.play();
  }).then(function(){
    $('#camtext').hidden = true; $('#frame').hidden = false; $('#camstart').textContent = 'Stop camera'; tick();
    // The flashlight button only appears on phones whose camera allows it (most Android phones).
    try { var tr = stream.getVideoTracks()[0], caps = tr.getCapabilities ? tr.getCapabilities() : {}; $('#torch').hidden = !caps.torch; } catch(e){}
    try { navigator.wakeLock && navigator.wakeLock.request('screen'); } catch(e){}
  }).catch(function(e){
    $('#camtext').textContent = 'The camera didn’t start (' + (e && e.name || 'blocked') + '). Allow camera access, or use “Take a photo instead”.';
  });
});
var torchOn = false;
$('#torch').addEventListener('click', function(){
  if (!stream) return;
  var tr = stream.getVideoTracks()[0];
  tr.applyConstraints({advanced: [{torch: !torchOn}]}).then(function(){
    torchOn = !torchOn; $('#torch').textContent = torchOn ? 'Flashlight off' : 'Flashlight on';
  }).catch(function(){ $('#torch').hidden = true; });
});
$('#photobtn').addEventListener('click', function(){ $('#photo').click(); });
// Load through an <img> first: iPhones save HEIC photos, which the phone can show but createImageBitmap often can't read.
function loadImage(f){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function(){ res(img); setTimeout(function(){ URL.revokeObjectURL(url); }, 2000); };
    img.onerror = function(){ URL.revokeObjectURL(url); (window.createImageBitmap ? createImageBitmap(f) : Promise.reject(new Error('no decoder'))).then(res, rej); };
    img.src = url;
  });
}
// The phone's own QR reader first (Android), then jsQR at a few sizes: a QR code that's small in the photo needs more pixels.
function readQR(img){
  var w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  var first = detector ? detector.detect(img).then(function(c){ return c && c[0] ? c[0].rawValue : null; }).catch(function(){ return null; }) : Promise.resolve(null);
  return first.then(function(v){
    if (v || !window.jsQR) return v;
    var sizes = [1400, 1000, 700, 2400];
    for (var i = 0; i < sizes.length; i++) {
      var s = Math.min(1, sizes[i] / Math.max(w0, h0));
      canvas.width = Math.round(w0 * s); canvas.height = Math.round(h0 * s);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var r = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height, {inversionAttempts: 'attemptBoth'});
      if (r) return r.data;
    }
    return null;
  });
}
$('#photo').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  var b = $('#photobtn'); b.disabled = true; b.textContent = 'Reading photo…';
  loadImage(f).then(readQR).then(function(v){
    if (v) { lastValue = ''; paused = false; onValue(v); }
    else verdict('bad', 'No QR found', '', 'Try again a little closer, with the whole QR code in the photo and not blurry.');
  }).catch(function(){ verdict('bad', 'Couldn’t read photo', '', 'Try taking it again.'); })
  .then(function(){ b.disabled = false; b.textContent = 'Take a photo instead'; });
});

/* ---------- status ---------- */
function render(){
  var st = $('#status'), n = signups().length, inCount = 0;
  signups().forEach(function(s){ if (usedInfo(s.id)) inCount++; });
  if (!online()) { st.className = 'pill bad'; st.textContent = 'No signal · offline mode'; }
  else if (queue.length) { st.className = 'pill warn'; st.textContent = 'Syncing ' + queue.length + '…'; }
  else if (lastOk && Date.now() - lastOk < 60000) { st.className = 'pill ok'; st.textContent = 'Online · up to date'; }
  else { st.className = 'pill warn'; st.textContent = 'Connecting…'; }
  $('#listinfo').textContent = list ? (n + (n === 1 ? ' car' : ' cars') + ' on the list · ' + inCount + ' in · list from ' + fmtTime(list.at) + (queue.length ? ' · ' + queue.length + ' waiting to sync' : '')) : 'The gate list isn’t on this phone yet. Get signal and tap Get new sign-ups.';
  var c = $('#conflicts');
  c.hidden = !conflicts.length;
  if (conflicts.length) c.innerHTML = '<div class="panel" style="border-color:var(--warn)"><b>Let in twice while offline</b><div class="note">The first check-in counts. Check these cars if you can.</div>' +
    conflicts.slice(0, 8).map(function(x){ return '<div class="note">' + esc(x.name) + ': first ' + fmtTime(x.first) + (x.firstBy ? ' (' + esc(x.firstBy) + ')' : '') + ', again here ' + fmtTime(x.again) + '</div>'; }).join('') +
    '<button type="button" id="clearc" style="margin-top:8px;padding:8px 12px;font-size:14px">Clear this list</button></div>';
  renderResults();
}
document.addEventListener('click', function(e){ if (e.target.id === 'clearc') { conflicts = []; save(); render(); } });
setInterval(render, 20000);

render();
flush().then(refresh);
})();
</script>
